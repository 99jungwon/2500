<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>띠듀공듀 2500일</title>
<meta name="theme-color" content="#fff5f3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f3;
    --ink: #4a3539;
    --soft: #9a7b80;
    --accent: #e8738a;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: 'Gowun Dodum', sans-serif; -webkit-tap-highlight-color: transparent; }

  /* 시작 화면 */
  #intro {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; cursor: pointer;
    transition: opacity .8s ease, visibility .8s;
  }
  #intro.hide { opacity: 0; visibility: hidden; }
  .names { font-family: 'Gaegu', cursive; font-size: 30px; color: var(--accent); letter-spacing: 2px; }
  .big { font-family: 'Gaegu', cursive; font-weight: 700; font-size: 92px; line-height: 1; margin: 10px 0 4px; }
  .big small { font-size: 40px; }
  .since { color: var(--soft); font-size: 15px; }
  .tap { margin-top: 48px; font-size: 14px; color: var(--soft); animation: pulse 1.6s ease-in-out infinite; }
  .heart { display: inline-block; animation: beat 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }

  /* 슬라이드 */
  #track {
    height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain;
  }
  #track::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 20px 72px;
  }
  .polaroid {
    background: var(--card); padding: 12px 12px 0; border-radius: 4px;
    box-shadow: 0 10px 30px rgba(120, 60, 70, .15);
    max-width: 100%; max-height: 100%;
    display: flex; flex-direction: column;
    transform: rotate(var(--tilt));
  }
  .polaroid img {
    display: block; max-width: calc(100vw - 64px); max-height: calc(100dvh - 240px);
    object-fit: contain; border-radius: 2px; background: #f3e9e7;
  }
  .caption {
    font-family: 'Gaegu', cursive; font-size: 22px; text-align: center;
    padding: 12px 6px 14px; min-height: 52px;
  }

  .letter {
    background: var(--card); border-radius: 16px; padding: 28px 24px;
    max-width: 440px; width: 100%; max-height: 100%; overflow-y: auto;
    box-shadow: 0 10px 30px rgba(120, 60, 70, .12);
    line-height: 1.85; font-size: 16px; white-space: pre-line; word-break: keep-all;
  }
  .letter h2 { font-family: 'Gaegu', cursive; font-size: 28px; color: var(--accent); margin-bottom: 12px; }
  .letter .sign { text-align: right; margin-top: 16px; font-family: 'Gaegu', cursive; font-size: 22px; }
  .count { margin-top: 18px; text-align: center; color: var(--soft); font-size: 14px; }
  .count b { color: var(--accent); font-size: 18px; }

  /* 하단 진행 표시 */
  #bar {
    position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 5px; pointer-events: none;
  }
  #bar i { width: 6px; height: 6px; border-radius: 3px; background: #e6cfd2; transition: all .3s; }
  #bar i.on { width: 18px; background: var(--accent); }
  .hint { position: fixed; bottom: max(36px, calc(env(safe-area-inset-bottom) + 16px)); width: 100%;
    text-align: center; font-size: 12px; color: var(--soft); transition: opacity .5s; pointer-events: none; }

  /* 음악 버튼 */
  #music {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.85); color: var(--accent); font-size: 18px;
    box-shadow: 0 2px 10px rgba(120,60,70,.15); cursor: pointer;
  }
  #music.playing { animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 떠다니는 하트 */
  .float { position: fixed; bottom: -30px; pointer-events: none; color: var(--accent);
    opacity: .5; animation: rise linear forwards; z-index: 1; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(30deg); opacity: 0; } }

  @media (prefers-color-scheme: dark) {
    :root { --bg: #2a2023; --ink: #f4e6e8; --soft: #b8999e; --accent: #f08da1; --card: #3a2c30; }
    .polaroid img { background: #4a3a3e; }
    #bar i { background: #5a4549; }
    #music { background: rgba(58,44,48,.9); }
  }
</style>
</head>
<body>

<div id="intro">
  <div class="names">띠듀 <span class="heart">♥</span> 공듀</div>
  <div class="big"><span id="dday">2500</span><small>일</small></div>
  <div class="since">2019. 12. 06 부터</div>
  <div class="tap">화면을 눌러줘</div>
</div>

<button id="music" aria-label="음악 켜기/끄기" hidden>♪</button>
<audio id="audio" src="music.mp3" loop preload="auto"></audio>

<div id="track"></div>
<div id="bar"></div>
<div class="hint" id="hint">← 옆으로 넘겨봐 →</div>

<script>
  // ===== 여기만 고치면 돼 =====
  const START = new Date(2019, 11, 6);   // 처음 만난 날 (월은 0부터 시작이라 12월 = 11)
  const PHOTO_COUNT = 16;                // photos 폴더의 사진 개수 (01.jpg ~ 16.jpg)

  // 사진 아래에 하나씩 순서대로 붙는 짧은 메시지
  const MESSAGES = [
    "2500일 동안",
    "같이 웃고",
    "같이 먹고",
    "같이 걷고",
    "가끔은 다투고",
    "그래도 다시 웃고",
    "이 날도 기억나?",
    "여기 또 가자",
    "제일 좋아하는 사진",
    "너무 귀여워",
    "고마워",
    "늘 내 편이 되어줘서",
    "앞으로도",
    "지금처럼",
    "계속 같이 있자",
    "사랑해 ♥",
  ];

  const LETTER_TITLE = "희주에게";
  const LETTER = `우리가 만난 지 벌써 2500일이 됐어.
정말 오래된 것 같으면서도, 또 정말 금방 지나간 것 같아.

대학에서 처음 만났던 우리가
어느새 둘 다 취업까지 했다니, 시간 참 빠르다.

그동안 많이 싸우기도 했지만
그래도 늘 내 옆에 있어 주고
변함없이 좋아해 줘서 정말 고맙고, 많이 사랑해.

여기 있는 예쁜 사진들처럼
앞으로 같이 찍을 더 예쁜 사진들도,
희주와 함께할 날들도 너무 기대돼.

올해 갔던 일본 여행처럼
좋은 해외여행도 꼭 또 같이 가자.

예쁘고 귀여운 희주를
사진에 담을 기회를 나한테 계속 줘.
사진도 많이 찍어 주고, 늘 옆에 있어 줄게.

사랑해, 희주야 ♥`;
  const LETTER_SIGN = "로시 아빠이자 희주 남자친구 정원이가";
  // ===========================

  const dayCount = Math.floor((new Date().setHours(0,0,0,0) - START) / 86400000) + 1;
  document.getElementById('dday').textContent = dayCount.toLocaleString();

  // 사진 순서 섞기 (열 때마다 랜덤)
  const order = Array.from({ length: PHOTO_COUNT }, (_, i) => i + 1);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  const track = document.getElementById('track');
  order.forEach((n, i) => {
    const s = document.createElement('section');
    s.className = 'slide';
    const tilt = (Math.random() * 4 - 2).toFixed(1) + 'deg';
    s.innerHTML = `
      <figure class="polaroid" style="--tilt:${tilt}">
        <img src="photos/${String(n).padStart(2, '0')}.jpg" alt="" ${i > 1 ? 'loading="lazy"' : ''}>
        <figcaption class="caption">${MESSAGES[i % MESSAGES.length] || ''}</figcaption>
      </figure>`;
    track.appendChild(s);
  });

  const last = document.createElement('section');
  last.className = 'slide';
  last.innerHTML = `
    <div class="letter">
      <h2></h2><div class="body"></div><div class="sign"></div>
    </div>
    <div class="count">함께한 지 <b>${dayCount.toLocaleString()}</b>일째</div>`;
  last.querySelector('h2').textContent = LETTER_TITLE;
  last.querySelector('.body').textContent = LETTER;
  last.querySelector('.sign').textContent = LETTER_SIGN;
  track.appendChild(last);

  // 진행 표시
  const total = track.children.length;
  const bar = document.getElementById('bar');
  bar.innerHTML = '<i></i>'.repeat(total);
  const dots = [...bar.children];
  const hint = document.getElementById('hint');
  let current = -1;
  function update() {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    if (idx === current) return;
    current = idx;
    dots.forEach((d, i) => d.classList.toggle('on', i === idx));
    if (idx > 0) hint.style.opacity = 0;
  }
  track.addEventListener('scroll', update, { passive: true });
  update();

  // PC에서는 키보드 화살표로도 넘기기
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
  });

  // 음악 (music.mp3 파일이 있을 때만 버튼이 보임)
  const audio = document.getElementById('audio');
  const btn = document.getElementById('music');
  let hasMusic = false;
  audio.addEventListener('canplay', () => { hasMusic = true; btn.hidden = false; }, { once: true });
  function setPlaying(on) {
    if (!hasMusic) return;
    if (on) audio.play().then(() => btn.classList.add('playing')).catch(() => {});
    else { audio.pause(); btn.classList.remove('playing'); }
  }
  btn.addEventListener('click', () => setPlaying(audio.paused));

  // 시작 화면 누르면 시작 (폰은 화면을 눌러야 음악이 재생될 수 있음)
  document.getElementById('intro').addEventListener('click', e => {
    e.currentTarget.classList.add('hide');
    setPlaying(true);
    setInterval(spawnHeart, 1400);
  });

  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'float';
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 10 + Math.random() * 14 + 'px';
    h.style.animationDuration = 6 + Math.random() * 5 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 12000);
  }
</script>
</body>
</html>
